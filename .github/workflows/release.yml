name: Release

# Pushing a tag vX.Y.Z:
#   1. runs the full CI suite on the tagged commit;
#   2. stages the package on npm through trusted publishing (no token). It is
#      not public until a maintainer approves it on npmjs.com with 2FA;
#   3. waits for approval of the `release` environment, then publishes
#      server.json to the MCP registry and creates the GitHub release.
# See CONTRIBUTING.md, "Releasing".

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # npm stage publish needs npm 11.15 or newer.
  NPM_VERSION: 11.20.0
  MCP_PUBLISHER_VERSION: v1.8.9

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  stage-npm:
    name: Stage on npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: The tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - name: Stage the package
        run: |
          if npm view "northbid@$VERSION" version > /dev/null 2>&1; then
            echo "northbid@$VERSION is already on npm; nothing to stage."
          else
            npm stage publish
            echo "::notice::northbid@$VERSION is staged. Approve it at https://www.npmjs.com/settings/~/staged-packages, then approve the release environment."
          fi

  publish:
    name: MCP registry and GitHub release
    needs: stage-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment hold the job until the npm
    # package has been approved.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # MCP registry login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: The package is live on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if ! npm view "northbid@$version" version; then
            echo "::error::northbid@$version is not on npm yet. Approve the staged package, then re-run this job."
            exit 1
          fi
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog section for this version, without its heading.
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
